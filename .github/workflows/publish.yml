name: Publish installer
on:
  push:
    branches: [tea-towel]
    paths: ['.github/workflows/publish.yml']
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TeaTowel-Windows
          run-id: 42107321148
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: out
      - name: Put installer on a branch and a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la out
          gh release create tea-towel-v1.0 out/*.exe -R "${{ github.repository }}" --target tea-towel \
             --title "Tea Towel 1.0 (Windows)" --notes "Double-click to install, then Rescan plug-ins in Ableton." || true
          cd out
          git init -q -b tea-towel-installer
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -q -m "Windows installer"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" tea-towel-installer
