name: Build DEMOCRAZY

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "macOS" ]; then
            cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          else
            cmake -B build
          fi

      - name: Build
        run: cmake --build build --config Release --parallel 3

      - name: Make macOS installer
        if: runner.os == 'macOS'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_ID: ${{ secrets.MACOS_SIGN_ID }}
          MACOS_INSTALLER_SIGN_ID: ${{ secrets.MACOS_INSTALLER_SIGN_ID }}
          MACOS_NOTARY_ID: ${{ secrets.MACOS_NOTARY_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
        run: |
          bash installer/mac-package.sh 4.0.${GITHUB_RUN_NUMBER}
          mkdir -p out && cp out-mac/*.pkg out/

      - name: Make Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WIN_CERT_PFX: ${{ secrets.WIN_CERT_PFX }}
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc installer\windows.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # code signing, once there's a certificate (secrets WIN_CERT_PFX as base64, WIN_CERT_PASSWORD)
          if ($env:WIN_CERT_PFX) {
            [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:WIN_CERT_PFX))
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1
            & $signtool.FullName sign /f cert.pfx /p $env:WIN_CERT_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 "out\DEMOCRAZY Installer (Windows).exe"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: DEMOCRAZY-${{ matrix.name }}
          path: out/

  publish:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dl
      - name: Publish the installers (release + branch)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p out
          find dl -type f \( -name "*.exe" -o -name "*.pkg" \) -exec cp {} out/ \;
          ls -la out
          [ -n "$(ls out)" ] || exit 1
          TAG="democrazy-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" out/* -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
             --title "DEMOCRAZY build ${GITHUB_RUN_NUMBER}" --notes "DEMOCRAZY: thirteen plugins. Windows: double-click the .exe. Mac: open the .pkg. Then Rescan in Ableton." || true
          # the branch keeps only the Windows installer (the Mac .pkg is too big for git; it's on the release)
          mkdir -p branch && cp out/*.exe branch/ 2>/dev/null || true
          cd branch
          git init -q -b tea-towel-installer
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -q -m "Installers (build ${GITHUB_RUN_NUMBER})"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" tea-towel-installer
